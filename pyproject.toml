[project]
name = "cv-coach"
version = "0.1.0"
description = "Voice-enabled CV coach: RAG over your CV, traced with Langfuse"
requires-python = ">=3.11"
dependencies = ["openai", "langfuse", "langchain-core", "langchain-openai", "langchain-text-splitters", "gradio", "numpy", "pypdf", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cv-coach = "cv_coach.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
